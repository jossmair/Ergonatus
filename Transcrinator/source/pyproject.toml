[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcrinator"
version = "1.3.17"
description = "Dictée locale Windows en français"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "sounddevice>=0.5,<1", "numpy>=2,<3", "soxr>=0.5,<2", "pywin32>=308; sys_platform=='win32'", "comtypes>=1.4,<2", "httpx>=0.28,<1", "onnxruntime>=1.20,<2", "psutil>=6,<8", "text2num==3.0.0", "num2words==0.5.14"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pyinstaller", "pillow", "ruff"]

[project.scripts]
transcrinator = "app.main:main"
transcri = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

