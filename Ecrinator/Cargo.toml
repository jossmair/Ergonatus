[package]
name = "ecrinator"
version = "0.12.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Traitement de texte scolaire local de la suite Ergonatus"

[dependencies]
wordcraft-engine = { path = "vendor/wordcraft/crates/engine" }
wordcraft-doc = { path = "vendor/wordcraft/crates/doc" }
wordcraft-geom = { path = "vendor/wordcraft/crates/geom" }
wordcraft-fonts = { path = "vendor/wordcraft/crates/fonts" }
wordcraft-ui-egui = { path = "vendor/wordcraft/crates/ui-egui" }
wordcraft-formats = { path = "vendor/wordcraft/crates/formats" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
tempfile = "3"
rfd = "0.17"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
sha2 = "0.11.1"
craft-print = { path = "../PDFinator/vendor/craft-libs/crates/print" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Storage"] }

[dev-dependencies]
resvg = { version = "0.45.1", default-features = false }

[build-dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45.1", default-features = false }

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }

[patch."https://github.com/storytold/winprint.rs"]
winprint = { path = "../PDFinator/vendor/winprint" }

# Keep the layout/render/export engine fully optimized. The small host UI uses
# level 1 to keep native Windows maintenance builds practical; document work
# remains in the optimized Wordcraft crates.
[profile.release.package.ecrinator]
opt-level = 1

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[lints.rust]
unsafe_code = "forbid"
